name: tests

on:
  pull_request:
    branches: [main]
    # Skip CI for changes that can't break a test: plain docs, and CSV value
    # tweaks (tests read data/ through tests/suite_data.gd, not live CSVs).
    # RANDOM_EVENTS.md and game_story/**/*.md are runtime content with their
    # own id-resolution tests, so they're carved back out of the *.md skip.
    paths-ignore:
      - '**/*.md'
      - '!RANDOM_EVENTS.md'
      - '!game_story/**'
      - 'data/**/*.csv'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gut-shards:
    name: GUT shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, slice: '1/10', test_timeout: 3600, job_timeout: 75 }
          - { shard: 2, slice: '2/10' }
          - { shard: 3, slice: '3/10' }
          - { shard: 4, slice: '4/10' }
          - { shard: 5, slice: '5/10' }
          - { shard: 6, slice: '6/10' }
          - { shard: 7, slice: '4/5' }
          - { shard: 8, slice: '5/5' }
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_DIR: ${{ github.workspace }}/.godot-bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip /tmp/godot.zip -d "$GODOT_DIR"

      # Cache the asset import output (not committed to git) so the import
      # pass doesn't reimport the whole ~2.6GB art tree on every run.
      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-

      - name: Check test runner deadlines
        run: python3 tools/test_run_with_timeout.py

      - name: Run GUT shard
        env:
          GODOT: ${{ env.GODOT_DIR }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout || 2100 }}
        run: |
          chmod +x "$GODOT"
          # Mirror the cloud session's two-pass import (CLAUDE.md: the first
          # pass prints font/theme load errors that are gone on the next
          # one) so run_tests.sh's own import is the SECOND pass, same as a
          # known-green local/cloud run, not the only one.
          code=0
          python3 tools/run_with_timeout.py "$TEST_TIMEOUT_SECONDS" "$GODOT" --headless --path . --import || code=$?
          if [ "$code" != 0 ] && [ "$code" != 134 ]; then
            exit "$code"
          fi
          # Separate runners bound memory and avoid a shared wall-clock limit.
          # Split the three slow engine slices; retain the map/UI slices so
          # map hover/picking tests keep their existing shared setup order.
          lscpu
          time ./run_tests.sh --shard=${{ matrix.slice }}

  gut-tests:
    if: ${{ always() }}
    needs: gut-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every GUT shard to pass
        env:
          SHARD_RESULT: ${{ needs.gut-shards.result }}
        run: test "$SHARD_RESULT" = success
