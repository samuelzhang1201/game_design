name: tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      include:
        description: 'Explicit extra categories: simulation,gameplay,balance (comma separated)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-checks:
    runs-on: ubuntu-latest
    outputs:
      run-gut: ${{ steps.scope.outputs.run-gut }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check harness rules and handoff graph
        run: |
          python3 -m unittest discover -s .codex/hooks -p 'test_*.py'
          python3 tools/test_select_gut_tests.py
          python3 tools/test_run_tests.py
          python3 tools/test_run_with_timeout.py
          sh -n run_tests.sh
          bash -n .codex/hooks/session-start.sh
          python3 - <<'PY'
          import json, pathlib, re, tomllib
          json.loads(pathlib.Path('.codex/hooks.json').read_text())
          tomllib.loads(pathlib.Path('.codex/config.toml').read_text())
          for name in ['AGENTS.md', 'CLAUDE.md']:
              assert len(pathlib.Path(name).read_text()) < 20000, name
          for name in re.findall(r'`([a-z0-9_/]+/CLAUDE\.md)`', pathlib.Path('CLAUDE.md').read_text()):
              guide = pathlib.Path(name).read_text()
              assert len(guide) < 30000, name
              for topic in re.findall(r'`([a-z0-9_/]+/guide/[a-z0-9_]+\.md)`', guide):
                  assert len(pathlib.Path(topic).read_text()) < 30000, topic
          PY
      - name: Select content categories for this change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MANUAL_INCLUDE: ${{ inputs.include }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/select_gut_tests.py --functional \
              --request-text "GUT_INCLUDE: $MANUAL_INCLUDE" --github-output "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            python3 tools/select_gut_tests.py --base "$BASE_SHA" \
              --request-text "$PR_BODY" --github-output "$GITHUB_OUTPUT"
          fi

  gut-selected:
    needs: harness-checks
    if: ${{ needs.harness-checks.outputs.run-gut == 'true' }}
    name: GUT ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.harness-checks.outputs.matrix) }}
    env:
      GODOT_VERSION: 4.7-stable
      GODOT_DIR: ${{ github.workspace }}/.godot-bin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip /tmp/godot.zip -d "$GODOT_DIR"

      # Cache the asset import output (not committed to git) so the import
      # pass doesn't reimport the whole ~2.6GB art tree on every run.
      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-

      - name: Run selected GUT category
        env:
          GODOT: ${{ env.GODOT_DIR }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          TEST_TIMEOUT_SECONDS: 2100
        run: |
          chmod +x "$GODOT"
          # Mirror the cloud session's two-pass import (CLAUDE.md: the first
          # pass prints font/theme load errors that are gone on the next
          # one) so run_tests.sh's own import is the SECOND pass, same as a
          # known-green local/cloud run, not the only one.
          code=0
          python3 tools/run_with_timeout.py "$TEST_TIMEOUT_SECONDS" "$GODOT" --headless --path . --import || code=$?
          if [ "$code" != 0 ] && [ "$code" != 134 ]; then
            exit "$code"
          fi
          time ./run_tests.sh --category "${{ matrix.category }}"

  gut-tests:
    if: ${{ always() }}
    needs: [harness-checks, gut-selected]
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks selected for this PR to pass
        env:
          HARNESS_RESULT: ${{ needs.harness-checks.result }}
          RUN_GUT: ${{ needs.harness-checks.outputs.run-gut }}
          SELECTED_RESULT: ${{ needs.gut-selected.result }}
        run: |
          test "$HARNESS_RESULT" = success
          if [ "$RUN_GUT" = true ]; then
            test "$SELECTED_RESULT" = success
          else
            test "$RUN_GUT" = false
            test "$SELECTED_RESULT" = skipped
          fi
